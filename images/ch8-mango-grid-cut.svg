<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-label="Mango grid cut">
  <rect width="520" height="300" fill="#fffef0"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Mango grid cut (hedgehog)</text>
  <text x="120" y="52" text-anchor="middle" font-size="12" fill="#666">1. Cut around pit</text>
  <ellipse cx="70" cy="115" rx="28" ry="40" fill="#f4c430" stroke="#c9a020" stroke-width="2"/>
  <rect x="95" y="75" width="18" height="80" rx="4" fill="#8b6914"/>
  <ellipse cx="130" cy="115" rx="28" ry="40" fill="#f4c430" stroke="#c9a020" stroke-width="2"/>
  <text x="300" y="52" text-anchor="middle" font-size="12" fill="#666">2. Score grid</text>
  <path d="M240,75 Q300,55 360,75 L360,165 Q300,185 240,165 Z" fill="#ffd54f" stroke="#c9a020" stroke-width="2"/>
  <g stroke="#c9a020" stroke-width="1.5">
    <line x1="255" y1="85" x2="345" y2="85"/><line x1="250" y1="105" x2="350" y2="105"/>
    <line x1="245" y1="125" x2="355" y2="125"/><line x1="265" y1="78" x2="265" y2="162"/>
    <line x1="300" y1="76" x2="300" y2="164"/><line x1="335" y1="78" x2="335" y2="162"/>
  </g>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#666">3. Push out cubes</text>
  <path d="M410,90 Q450,80 470,100 L470,150 Q450,170 410,160 Z" fill="#ffd54f" stroke="#c9a020" stroke-width="2"/>
  <rect x="418" y="100" width="12" height="12" fill="#ffb300" stroke="#e65100"/>
  <rect x="432" y="108" width="12" height="12" fill="#ffb300" stroke="#e65100"/>
  <rect x="424" y="122" width="12" height="12" fill="#ffb300" stroke="#e65100"/>
</svg>